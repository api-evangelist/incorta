aid: incorta
name: Incorta
description: >-
  Incorta is a unified data and analytics platform that lets teams acquire, enrich,
  analyze, and act on operational data without a traditional data warehouse or heavy
  dimensional modeling, using its Direct Data Mapping engine to query source data
  directly at high speed. For developers, Incorta exposes a tenant-scoped Public API
  (v1 and v2) under /incorta/api/v2 for loading physical schemas, querying business
  views, extracting data to external tables, scheduling dashboard reports, and
  administration, authenticated with Personal Access Tokens or OAuth 2.0 JWTs. Incorta
  also ships a Python CLI for metadata import/export, Python Data APIs for external
  notebooks, and a TypeScript Component SDK for building custom dashboard visualizations.
  Incorta is backed by GV and Kleiner Perkins.
